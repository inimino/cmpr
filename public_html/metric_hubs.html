<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Metric Plot</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    body { font-family: monospace; margin: 20px; background: #1e1e1e; color: #d4d4d4; }
    h1 { color: #4ec9b0; }
    #container { max-width: 1200px; margin: 0 auto; }
    canvas { background: #252526; border-radius: 4px; }
    .stats { margin: 20px 0; padding: 15px; background: #252526; border-radius: 4px; }
    .stats div { display: inline-block; margin-right: 30px; }
  </style>
</head>
<body>
  <div id="container">
    <h1>Hub Blocks Over Time</h1>
    <div class="stats" id="stats"></div>
    <canvas id="chart"></canvas>
  </div>
  <script>
const metricData = [
  { time: '2025-12-28T08:56:55', value: 10 },
  { time: '2025-12-28T08:58:15', value: 10 },
  { time: '2025-12-28T08:59:14', value: 10 },
  { time: '2025-12-28T09:04:13', value: 10 },
  { time: '2025-12-28T09:04:26', value: 10 },
  { time: '2025-12-28T09:06:37', value: 11 },
  { time: '2025-12-28T09:06:51', value: 11 },
  { time: '2025-12-28T09:09:12', value: 11 },
  { time: '2025-12-28T09:11:01', value: 12 },
  { time: '2025-12-28T09:20:59', value: 12 },
  { time: '2025-12-28T09:23:09', value: 12 },
  { time: '2025-12-28T09:29:46', value: 12 },
  { time: '2025-12-28T09:31:18', value: 14 },
  { time: '2025-12-28T09:33:34', value: 17 },
  { time: '2025-12-28T09:34:52', value: 19 },
  { time: '2025-12-28T10:17:16', value: 19 },
  { time: '2025-12-28T10:20:29', value: 25 },
  { time: '2025-12-28T10:24:27', value: 37 },
  { time: '2025-12-28T10:25:29', value: 37 },
  { time: '2025-12-28T10:38:29', value: 37 },
  { time: '2025-12-28T10:49:31', value: 44 },
  { time: '2025-12-28T10:50:58', value: 44 },
  { time: '2025-12-28T10:57:00', value: 44 },
];

// Calculate statistics
const values = metricData.map(d => d.value);
const stats = {
  count: values.length,
  min: Math.min(...values),
  max: Math.max(...values),
  avg: (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1),
  latest: values[values.length - 1]
};

document.getElementById('stats').innerHTML = `
  <div><strong>Data Points:</strong> ${stats.count}</div>
  <div><strong>Latest:</strong> ${stats.latest}</div>
  <div><strong>Min:</strong> ${stats.min}</div>
  <div><strong>Max:</strong> ${stats.max}</div>
  <div><strong>Avg:</strong> ${stats.avg}</div>
`;

// Create chart
const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: {
    datasets: [{
      label: 'YLABEL',
      data: metricData.map(d => ({
        x: new Date(d.time),
        y: d.value
      })),
      borderColor: '#4ec9b0',
      backgroundColor: 'rgba(78, 201, 176, 0.1)',
      tension: 0.1,
      fill: true
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: true,
    aspectRatio: 2,
    scales: {
      x: {
        type: 'time',
        time: {
          unit: 'hour',
          displayFormats: {
            hour: 'MMM d HH:mm'
          }
        },
        title: {
          display: true,
          text: 'Time',
          color: '#d4d4d4'
        },
        grid: {
          color: '#3e3e42'
        },
        ticks: {
          color: '#d4d4d4'
        }
      },
      y: {
        title: {
          display: true,
          text: 'YLABEL',
          color: '#d4d4d4'
        },
        grid: {
          color: '#3e3e42'
        },
        ticks: {
          color: '#d4d4d4'
        },
        beginAtZero: true
      }
    },
    plugins: {
      legend: {
        display: false
      },
      tooltip: {
        backgroundColor: '#252526',
        titleColor: '#4ec9b0',
        bodyColor: '#d4d4d4',
        borderColor: '#3e3e42',
        borderWidth: 1
      }
    }
  }
});
  </script>
</body>
</html>
